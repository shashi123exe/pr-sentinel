# ==============================================================================
# PR Sentinel — Render Single-Service Infrastructure Blueprint (Zero-Cost Plan)
# ==============================================================================
# Documentation: https://render.com/docs/blueprint-spec
#
# ARCHITECTURE & ZERO-COST HOSTING STRATEGY:
# - Single Docker Web Service (`plan: free`) serving both compiled React 19 SPA
#   and FastAPI Python 3.12 backend on a unified domain/port.
# - Persistent Database: Neon Free Serverless PostgreSQL (0.5 GB SSD, no 30-day
#   deletion limit). Configured via DATABASE_URL in Render Dashboard.
# - LLM Engine: Google Gemini API Free Tier (gemini-2.5-pro / gemini-2.5-flash).
#
# FREE-TIER OPERATIONAL CONSTRAINTS:
# 1. Spin-down on idle: Web service automatically spins down after 15 minutes of
#    inactivity. Cold start takes 30-60 seconds on next incoming request.
# 2. Resource limits: 512 MB RAM, 0.1 CPU (burstable). Single worker (`--workers 1`)
#    and single instance (`numInstances: 1`) are strictly enforced.
# 3. Persistent storage: SQLite is NOT supported on Render Free tier (ephemeral disk).
#    Neon Free PostgreSQL MUST be configured via DATABASE_URL for durable data.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PR Sentinel — Unified Web Service (React SPA + FastAPI Backend)
  # ----------------------------------------------------------------------------
  - type: web
    name: pr-sentinel
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: SERVE_FRONTEND
        value: "true"
      # Database connection URL:
      # Provide your Neon Free PostgreSQL connection string via Render Dashboard
      # e.g. postgresql://user:password@ep-xyz.us-east-2.aws.neon.tech/neondb?sslmode=require
      # PR Sentinel automatically normalizes postgres:// to postgresql+psycopg://
      - key: DATABASE_URL
        sync: false
      # Daily rolling review limit (spending protection against Gemini LLM quota exhaustion)
      - key: MAX_REVIEWS_PER_DAY
        value: "20"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      # Sensitive secrets configured via Render Dashboard (never hardcoded in blueprint)
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_MODEL
        sync: false
