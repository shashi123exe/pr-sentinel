name: PR Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principle of least privilege
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Backend Quality, Security, and Automated Test Suite
  # ----------------------------------------------------------------------------
  backend:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'

      - name: Set up Node.js 22 (Backend ESLint Tool)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/tools/eslint/package-lock.json'

      - name: Install isolated ESLint dependencies
        working-directory: backend/tools/eslint
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify code formatting (Ruff)
        run: ruff format --check .

      - name: Run code linter (Ruff)
        run: ruff check .

      - name: Run static security audit (Bandit)
        run: bandit -r app -q

      - name: Run complete automated test suite with coverage
        run: pytest -q --cov=app --cov-report=term --cov-report=xml tests

  # ----------------------------------------------------------------------------
  # Frontend Quality, Security, and Production Bundle Build
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Clean install dependencies
        run: npm ci

      - name: Run frontend linter (Oxlint)
        run: npm run lint

      - name: Run production TypeScript and Vite build
        run: npm run build

      - name: Run frontend test suite (Vitest)
        run: npm test -- --run

      - name: Audit production dependencies (npm audit)
        run: npm audit --omit=dev

  # ----------------------------------------------------------------------------
  # Docker Build and Multi-Container Compose Validation
  # ----------------------------------------------------------------------------
  docker:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

      - name: Build Render single-service production image
        run: docker build -f Dockerfile.render -t pr-sentinel:production .

      - name: Validate Render production container contents
        run: |
          echo "Verifying Python application and core dependencies..."
          docker run --rm pr-sentinel:production /opt/venv/bin/python -c "import fastapi, sqlalchemy, psycopg, pydantic; print('Python dependencies verified')"

          echo "Verifying compiled React production build..."
          docker run --rm pr-sentinel:production test -f /app/frontend/dist/index.html

          echo "Verifying Node.js runtime..."
          docker run --rm pr-sentinel:production /usr/local/bin/node --version

          echo "Verifying ESLint executable and installed dependencies..."
          docker run --rm pr-sentinel:production test -d /app/tools/eslint/node_modules
          docker run --rm pr-sentinel:production /usr/local/bin/node /app/tools/eslint/node_modules/eslint/bin/eslint.js --version

      - name: Verify Render production container startup and health check
        run: |
          echo "Starting Render production container in background..."
          CONTAINER_ID=$(docker run -d -p 10000:10000 -e SERVE_FRONTEND=true pr-sentinel:production)

          echo "Waiting for health check endpoint to respond..."
          HEALTHY=0
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:10000/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check succeeded with HTTP 200 after ${i}s"
              HEALTHY=1
              break
            fi
            sleep 1
          done

          echo "Container logs:"
          docker logs "$CONTAINER_ID"

          echo "Health endpoint response payload:"
          curl -s http://localhost:10000/api/health || true
          echo ""

          docker stop "$CONTAINER_ID"
          docker rm "$CONTAINER_ID"

          if [ "$HEALTHY" -ne 1 ]; then
            echo "Health check failed!"
            exit 1
          fi
