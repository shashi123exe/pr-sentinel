[project]
name = "pr-sentinel-backend"
version = "0.1.0"
description = "PR Sentinel - AI-Powered GitHub Pull Request Code Review Platform Backend"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.6",
    "httpx==0.28.1",
    "google-genai==2.34.0",
    "langgraph==1.2.19",
    "slowapi==0.1.10",
    "ruff==0.17.3",
    "bandit==1.9.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "postgres: marks tests requiring a disposable PostgreSQL database",
]
